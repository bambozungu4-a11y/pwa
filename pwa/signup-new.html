<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - THE PLUG</title>
    <link rel="stylesheet" href="css/shared.css">
    <style>
        .signup-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .signup-container {
            width: 100%;
            max-width: 540px;
        }

        .signup-panel input,
        .signup-panel select {
            width: 100%;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-row input,
        .form-row select {
            width: 100%;
        }

        .password-checklist {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }

        .password-checklist ul {
            list-style: none;
            margin: 8px 0 0;
            padding: 0;
        }

        .password-checklist li {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .checkmark {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: inline-block;
            text-align: center;
            line-height: 16px;
            font-size: 11px;
        }

        .checkmark.checked {
            background: #22c55e;
            color: white;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }

        .form-actions button {
            flex: 1;
        }

        .user-type-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .user-type-btn {
            padding: 16px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .user-type-btn:hover,
        .user-type-btn.active {
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .form-actions {
                flex-direction: column;
            }

            .form-actions button {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="signup-wrapper">
        <div class="signup-container">
            <div class="page-content">
                <h1>THE PLUG</h1>
                <h2>Create Account</h2>
                <p style="text-align: center;">Join us to start shopping or selling</p>

                <div id="error-container"></div>

                <div class="panel signup-panel">
                    <form id="signup-form">
                        <!-- User Type Selection -->
                        <div class="form-group">
                            <label>Account Type</label>
                            <div class="user-type-selector">
                                <button type="button" class="user-type-btn active" data-type="customer">
                                    🛍️ Customer
                                </button>
                                <button type="button" class="user-type-btn" data-type="supplier">
                                    🏪 Supplier
                                </button>
                            </div>
                            <input type="hidden" id="userType" name="userType" value="customer" required>
                        </div>

                        <!-- Personal Information -->
                        <div class="form-group">
                            <label for="name">Full Name *</label>
                            <input type="text" id="name" name="name" placeholder="John Doe" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="email">Email *</label>
                                <input type="email" id="email" name="email" placeholder="you@example.com" required>
                            </div>
                            <div class="form-group">
                                <label for="phone">Phone *</label>
                                <input type="tel" id="phone" name="phone" placeholder="(555) 000-0000" required>
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="form-group">
                            <label for="password">Password *</label>
                            <input type="password" id="password" name="password" placeholder="Create a strong password" required>
                            <div class="password-checklist">
                                <div><strong>Password requirements:</strong></div>
                                <ul>
                                    <li><span class="checkmark" id="check-length">✓</span> At least 8 characters</li>
                                    <li><span class="checkmark" id="check-upper">✓</span> 1 uppercase letter</li>
                                    <li><span class="checkmark" id="check-lower">✓</span> 1 lowercase letter</li>
                                    <li><span class="checkmark" id="check-number">✓</span> 1 number</li>
                                    <li><span class="checkmark" id="check-special">✓</span> 1 special character (!@#$%^&*)</li>
                                </ul>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword">Confirm Password *</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
                        </div>

                        <!-- Supplier Information (Hidden by default) -->
                        <div id="supplier-fields" style="display: none;">
                            <div class="form-group">
                                <label for="storeName">Store Name *</label>
                                <input type="text" id="storeName" name="storeName" placeholder="Your Store Name">
                            </div>
                            <div class="form-group">
                                <label for="storeDescription">Store Description</label>
                                <textarea id="storeDescription" name="storeDescription" placeholder="Brief description of your store" style="height: 100px;"></textarea>
                            </div>
                        </div>

                        <!-- Address Information -->
                        <div class="form-group">
                            <label for="address">Street Address</label>
                            <input type="text" id="address" name="address" placeholder="123 Main St">
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="city">City</label>
                                <input type="text" id="city" name="city" placeholder="New York">
                            </div>
                            <div class="form-group">
                                <label for="state">State</label>
                                <input type="text" id="state" name="state" placeholder="NY">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="zipCode">ZIP Code</label>
                                <input type="text" id="zipCode" name="zipCode" placeholder="10001">
                            </div>
                            <div class="form-group">
                                <label for="country">Country</label>
                                <input type="text" id="country" name="country" placeholder="United States">
                            </div>
                        </div>

                        <!-- Terms & Privacy -->
                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="terms" name="terms" required>
                                I agree to the <a href="#" style="color: #c2e0ff;">Terms of Service</a> and <a href="#" style="color: #c2e0ff;">Privacy Policy</a>
                            </label>
                        </div>

                        <!-- Submit -->
                        <button class="btn btn-primary" type="submit" style="width: 100%; margin-top: 20px;">Create Account</button>

                        <p class="signup-note" style="margin-top: 20px;">Already have an account? <a href="index.html">Sign in</a></p>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/signup.js"></script>
</body>
</html>
