<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Past Orders - The Plug</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #fff;
            background-color: #0f1115;
            background-image: radial-gradient(circle at top, rgba(255,255,255,0.08), transparent 32%), radial-gradient(circle at bottom right, rgba(255,255,255,0.04), transparent 28%), url("ss.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .page-content {
            width: min(960px, calc(100% - 32px));
            margin: 32px auto;
            padding: 32px 24px 40px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 36px;
            box-shadow: 0 28px 80px rgba(0,0,0,0.24);
            backdrop-filter: blur(18px);
            box-sizing: border-box;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 32px;
        }

        .lead {
            margin: 8px 0 0;
            color: rgba(255,255,255,0.78);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 16px;
            border-radius: 14px;
            background: #fff;
            color: #111;
            text-decoration: none;
            font-weight: 700;
        }

        .orders-list {
            display: grid;
            gap: 14px;
            margin-top: 20px;
        }

        .order-card {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 20px;
            padding: 18px;
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .store-name {
            font-size: 18px;
            font-weight: 700;
        }

        .order-meta {
            color: rgba(255,255,255,0.76);
            font-size: 14px;
        }

        .pill {
            display: inline-block;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(255,255,255,0.1);
            font-size: 12px;
            letter-spacing: 0.02em;
            text-transform: capitalize;
        }

        .empty-state {
            padding: 20px;
            border-radius: 18px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.14);
            color: rgba(255,255,255,0.8);
        }

        @media (max-width: 640px) {
            .page-content { padding: 24px 16px 32px; }
            .header-row { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="page-content">
        <div class="header-row">
            <div>
                <h1>Past orders</h1>
                <p class="lead">Your recent purchases, grouped by store and product.</p>
            </div>
            <a class="btn" href="landing.html">Back to home</a>
        </div>

        <div id="orders-content"></div>
    </div>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
        if (!currentUser) {
            window.location.href = 'index.html';
        }

        const userEmail = currentUser?.email || 'guest';
        const ordersKey = 'pastOrders';
        const container = document.getElementById('orders-content');

        function getStoredOrders() {
            const savedOrders = JSON.parse(localStorage.getItem(ordersKey) || '[]');
            return savedOrders.filter(order => order.userEmail === userEmail);
        }

        function seedSampleOrders() {
            const existingOrders = JSON.parse(localStorage.getItem(ordersKey) || '[]');
            const hasUserOrders = existingOrders.some(order => order.userEmail === userEmail);
            if (hasUserOrders) return existingOrders;

            const sampleOrders = [
                {
                    userEmail,
                    store: 'Green Haven Dispensary',
                    product: 'Sunset Haze Pre-Roll',
                    date: '2026-06-18',
                    method: 'delivery'
                },
                {
                    userEmail,
                    store: 'North Loop Wellness',
                    product: 'Blueberry Gummies',
                    date: '2026-06-22',
                    method: 'take away'
                },
                {
                    userEmail,
                    store: 'Harbor CBD',
                    product: 'Relax Tincture',
                    date: '2026-06-28',
                    method: 'sit in'
                }
            ];

            const updatedOrders = [...existingOrders, ...sampleOrders];
            localStorage.setItem(ordersKey, JSON.stringify(updatedOrders));
            return updatedOrders;
        }

        function renderOrders() {
            const orders = getStoredOrders();
            if (!orders.length) {
                container.innerHTML = '<div class="empty-state">No past orders yet. Once you place an order, it will appear here.</div>';
                return;
            }

            const sortedOrders = [...orders].sort((a, b) => new Date(b.date) - new Date(a.date));
            container.innerHTML = `
                <div class="orders-list">
                    ${sortedOrders.map(order => `
                        <div class="order-card">
                            <div class="order-top">
                                <div>
                                    <div class="store-name">${order.store}</div>
                                    <div class="order-meta">${order.items ? order.items.join(', ') : order.product || 'Order details'}</div>
                                </div>
                                <span class="pill">${order.method}</span>
                            </div>
                            <div class="order-meta">Date: ${new Date(order.date).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        seedSampleOrders();
        renderOrders();
    </script>
</body>
</html>
